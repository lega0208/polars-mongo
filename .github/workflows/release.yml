name: Release

on:
  push:
    branches: [main]

concurrency:
  group: release-main
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  release:
    name: Create GitHub release
    runs-on: ubuntu-latest
    outputs:
      release_tag: ${{ steps.create-release.outputs.release_tag }}
    steps:
      - name: Check out main
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
          persist-credentials: true

      - name: Ignore stale push
        id: initial-freshness
        env:
          EVENT_SHA: ${{ github.sha }}
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin main --quiet
          current_sha="$(git rev-parse origin/main)"
          if [[ "$current_sha" != "$EVENT_SHA" ]]; then
            echo "Queued push $EVENT_SHA is no longer the tip of main; skipping."
            echo "stale=true" >> "$GITHUB_OUTPUT"
          else
            echo "stale=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Set up Python
        if: steps.initial-freshness.outputs.stale == 'false'
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Detect existing release for this commit
        id: existing
        if: steps.initial-freshness.outputs.stale != 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          REPOSITORY: ${{ github.repository }}
        shell: bash
        run: |
          set -euo pipefail
          current_version="$(python -c 'from scripts.release import read_cargo_version; print(read_cargo_version())')"
          current_tag="v$current_version"
          head_sha="$(git rev-parse HEAD)"

          set +e
          tag_target="$(gh api "repos/$REPOSITORY/git/ref/tags/$current_tag" --jq '.object.sha' 2>tag_error)"
          tag_status=$?
          set -e
          if [[ "$tag_status" -ne 0 ]]; then
            if grep -Eq 'HTTP[^0-9]*404|404 Not Found' tag_error; then
              echo "skip=false" >> "$GITHUB_OUTPUT"
              echo "reuse=false" >> "$GITHUB_OUTPUT"
              exit 0
            fi
            printf '%s\n' "$(<tag_error)" >&2
            echo "GitHub API failed while checking tag $current_tag." >&2
            exit 1
          fi
          tag_type="$(gh api "repos/$REPOSITORY/git/ref/tags/$current_tag" --jq '.object.type')"
          if [[ "$tag_type" == "tag" ]]; then
            tag_target="$(gh api "repos/$REPOSITORY/git/tags/$tag_target" --jq '.object.sha')"
          fi
          if [[ "$tag_target" != "$head_sha" ]]; then
            echo "Current-version tag $current_tag belongs to another commit; selecting a new version if needed."
            echo "skip=false" >> "$GITHUB_OUTPUT"
            echo "reuse=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          set +e
          release_draft="$(gh api "repos/$REPOSITORY/releases/tags/$current_tag" --jq '.draft' 2>release_error)"
          release_status=$?
          set -e
          if [[ "$release_status" -eq 0 ]]; then
            if [[ "$release_draft" == "true" ]]; then
              echo "Release $current_tag is a draft for $head_sha; retrying publication."
              echo "skip=false" >> "$GITHUB_OUTPUT"
              echo "reuse=true" >> "$GITHUB_OUTPUT"
              echo "release_tag=$current_tag" >> "$GITHUB_OUTPUT"
            else
              echo "Release $current_tag already covers $head_sha; skipping duplicate run."
              echo "skip=true" >> "$GITHUB_OUTPUT"
              echo "reuse=false" >> "$GITHUB_OUTPUT"
            fi
            exit 0
          fi
          if grep -Eq 'HTTP[^0-9]*404|404 Not Found' release_error; then
            echo "Tag $current_tag covers this commit but has no release; retrying release creation."
            echo "skip=false" >> "$GITHUB_OUTPUT"
            echo "reuse=true" >> "$GITHUB_OUTPUT"
            echo "release_tag=$current_tag" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          printf '%s\n' "$(<release_error)" >&2
          echo "GitHub API failed while checking release $current_tag." >&2
          exit 1

      - name: Read latest published release
        id: latest
        if: steps.initial-freshness.outputs.stale != 'true' && steps.existing.outputs.skip != 'true' && steps.existing.outputs.reuse != 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          REPOSITORY: ${{ github.repository }}
        shell: bash
        run: |
          set -euo pipefail
          set +e
          latest_tag="$(gh api "repos/$REPOSITORY/releases/latest" --jq '.tag_name' 2>latest_error)"
          latest_status=$?
          set -e
          if [[ "$latest_status" -ne 0 ]]; then
            if grep -Eq 'HTTP[^0-9]*404|404 Not Found' latest_error; then
              latest_tag=""
            else
              printf '%s\n' "$(<latest_error)" >&2
              echo "GitHub API failed while reading the latest release." >&2
              exit 1
            fi
          fi
          printf 'Latest published release: %s\n' "${latest_tag:-none}"
          printf 'latest_tag=%s\n' "$latest_tag" >> "$GITHUB_OUTPUT"

      - name: Select and synchronize version
        id: version
        if: steps.initial-freshness.outputs.stale != 'true' && steps.existing.outputs.skip != 'true' && steps.existing.outputs.reuse != 'true'
        env:
          LATEST_TAG: ${{ steps.latest.outputs.latest_tag }}
        shell: bash
        run: |
          set -euo pipefail
          if [[ -n "$LATEST_TAG" ]]; then
            version="$(python scripts/release.py --root . --latest "$LATEST_TAG")"
          else
            version="$(python scripts/release.py --root .)"
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "release_tag=v$version" >> "$GITHUB_OUTPUT"

      - name: Re-check main before writing
        id: final-freshness
        if: steps.initial-freshness.outputs.stale != 'true'
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin main --quiet
          current_sha="$(git rev-parse origin/main)"
          if [[ "$current_sha" != "$(git rev-parse HEAD)" ]]; then
            echo "main advanced while the version was being selected; skipping this push."
            echo "stale=true" >> "$GITHUB_OUTPUT"
          else
            echo "stale=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Commit version metadata
        if: steps.final-freshness.outputs.stale == 'false' && steps.existing.outputs.skip != 'true'
        env:
          VERSION: ${{ steps.version.outputs.version }}
        shell: bash
        run: |
          set -euo pipefail
          if git diff --quiet -- Cargo.toml Cargo.lock uv.lock; then
            echo "Version metadata already records $VERSION."
            exit 0
          fi
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add Cargo.toml Cargo.lock uv.lock
          git commit -m "chore: bump version to $VERSION"
          git push origin HEAD:main

      - name: Create or retry release
        id: create-release
        if: steps.final-freshness.outputs.stale == 'false' && steps.existing.outputs.skip != 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          REPOSITORY: ${{ github.repository }}
          RELEASE_TAG: ${{ steps.existing.outputs.release_tag || steps.version.outputs.release_tag }}
        shell: bash
        run: |
          set -euo pipefail
          commit_sha="$(git rev-parse HEAD)"
          git fetch origin main --quiet
          if [[ "$(git rev-parse origin/main)" != "$commit_sha" ]]; then
            echo "main advanced before release creation; not releasing an old commit."
            exit 0
          fi

          set +e
          tag_target="$(gh api "repos/$REPOSITORY/git/ref/tags/$RELEASE_TAG" --jq '.object.sha' 2>tag_error)"
          tag_status=$?
          set -e
          if [[ "$tag_status" -eq 0 ]]; then
            tag_type="$(gh api "repos/$REPOSITORY/git/ref/tags/$RELEASE_TAG" --jq '.object.type')"
            if [[ "$tag_type" == "tag" ]]; then
              tag_target="$(gh api "repos/$REPOSITORY/git/tags/$tag_target" --jq '.object.sha')"
            fi
            if [[ "$tag_target" != "$commit_sha" ]]; then
              echo "Tag $RELEASE_TAG already points to $tag_target, not $commit_sha; refusing to mutate it." >&2
              exit 1
            fi
            echo "Tag $RELEASE_TAG already points to this commit."
          elif grep -Eq 'HTTP[^0-9]*404|404 Not Found' tag_error; then
            echo "Tag $RELEASE_TAG does not exist yet."
          else
            printf '%s\n' "$(<tag_error)" >&2
            echo "GitHub API failed while checking tag $RELEASE_TAG." >&2
            exit 1
          fi

          set +e
          release_draft="$(gh api "repos/$REPOSITORY/releases/tags/$RELEASE_TAG" --jq '.draft' 2>release_error)"
          release_status=$?
          set -e
          if [[ "$release_status" -eq 0 ]]; then
            if [[ "$release_draft" == "true" ]]; then
              gh release edit "$RELEASE_TAG" --draft=false
            fi
            echo "Release $RELEASE_TAG already exists; safely retrying it."
          elif grep -Eq 'HTTP[^0-9]*404|404 Not Found' release_error; then
            gh release create "$RELEASE_TAG" --target "$commit_sha" --title "$RELEASE_TAG" --generate-notes
          else
            printf '%s\n' "$(<release_error)" >&2
            echo "GitHub API failed while checking release $RELEASE_TAG." >&2
            exit 1
          fi
          echo "release_tag=$RELEASE_TAG" >> "$GITHUB_OUTPUT"

  publish:
    name: Publish release wheels
    needs: release
    if: needs.release.outputs.release_tag != ''
    uses: ./.github/workflows/publish.yml
    with:
      release_tag: ${{ needs.release.outputs.release_tag }}
    permissions:
      contents: read
      id-token: write
