name: Publish

on:
  push:
    branches: [main]

concurrency:
  group: release-main
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  ci:
    uses: ./.github/workflows/ci.yml
    with:
      ref: ${{ github.sha }}

  prepare-version:
    name: Prepare release version
    needs: ci
    permissions:
      contents: write
    outputs:
      release_sha: ${{ steps.eligible.outputs.release_sha }}
      release_tag: ${{ steps.eligible.outputs.release_tag }}
    runs-on: ubuntu-latest
    steps:
      - name: Check out event commit
        uses: actions/checkout@v7
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: true

      - name: Ignore stale push
        id: initial-freshness
        env:
          EVENT_SHA: ${{ github.sha }}
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin main --quiet
          current_sha="$(git rev-parse origin/main)"
          if [[ "$current_sha" != "$EVENT_SHA" ]]; then
            echo "Queued push $EVENT_SHA is no longer the tip of main; skipping."
            echo "stale=true" >> "$GITHUB_OUTPUT"
          else
            echo "stale=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Set up Python
        if: steps.initial-freshness.outputs.stale == 'false'
        uses: actions/setup-python@v7
        with:
          python-version: '3.12'

      - name: Detect existing release for this commit
        id: existing
        if: steps.initial-freshness.outputs.stale != 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          REPOSITORY: ${{ github.repository }}
        shell: bash
        run: |
          set -euo pipefail
          current_version="$(python -c 'from scripts.release import read_cargo_version; print(read_cargo_version())')"
          current_tag="v$current_version"
          head_sha="$(git rev-parse HEAD)"

          set +e
          tag_target="$(gh api "repos/$REPOSITORY/git/ref/tags/$current_tag" --jq '.object.sha' 2>tag_error)"
          tag_status=$?
          set -e
          if [[ "$tag_status" -ne 0 ]]; then
            if grep -Eq 'HTTP[^0-9]*404|404 Not Found' tag_error; then
              echo "skip=false" >> "$GITHUB_OUTPUT"
              echo "reuse=false" >> "$GITHUB_OUTPUT"
              exit 0
            fi
            printf '%s\n' "$(<tag_error)" >&2
            echo "GitHub API failed while checking tag $current_tag." >&2
            exit 1
          fi
          tag_type="$(gh api "repos/$REPOSITORY/git/ref/tags/$current_tag" --jq '.object.type')"
          if [[ "$tag_type" == "tag" ]]; then
            tag_target="$(gh api "repos/$REPOSITORY/git/tags/$tag_target" --jq '.object.sha')"
          fi
          if [[ "$tag_target" != "$head_sha" ]]; then
            echo "Current-version tag $current_tag belongs to another commit; selecting a new version if needed."
            echo "skip=false" >> "$GITHUB_OUTPUT"
            echo "reuse=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          set +e
          release_draft="$(gh api "repos/$REPOSITORY/releases/tags/$current_tag" --jq '.draft' 2>release_error)"
          release_status=$?
          set -e
          if [[ "$release_status" -eq 0 ]]; then
            if [[ "$release_draft" == "true" ]]; then
              echo "Release $current_tag is a draft for $head_sha; retrying publication."
              echo "skip=false" >> "$GITHUB_OUTPUT"
              echo "reuse=true" >> "$GITHUB_OUTPUT"
              echo "release_tag=$current_tag" >> "$GITHUB_OUTPUT"
            else
              echo "Release $current_tag already covers $head_sha; skipping duplicate run."
              echo "skip=true" >> "$GITHUB_OUTPUT"
              echo "reuse=false" >> "$GITHUB_OUTPUT"
            fi
            exit 0
          fi
          if grep -Eq 'HTTP[^0-9]*404|404 Not Found' release_error; then
            echo "Tag $current_tag covers this commit but has no release; retrying release creation."
            echo "skip=false" >> "$GITHUB_OUTPUT"
            echo "reuse=true" >> "$GITHUB_OUTPUT"
            echo "release_tag=$current_tag" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          printf '%s\n' "$(<release_error)" >&2
          echo "GitHub API failed while checking release $current_tag." >&2
          exit 1

      - name: Read latest published release
        id: latest
        if: steps.initial-freshness.outputs.stale != 'true' && steps.existing.outputs.skip != 'true' && steps.existing.outputs.reuse != 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          REPOSITORY: ${{ github.repository }}
        shell: bash
        run: |
          set -euo pipefail
          set +e
          latest_tag="$(gh api "repos/$REPOSITORY/releases/latest" --jq '.tag_name' 2>latest_error)"
          latest_status=$?
          set -e
          if [[ "$latest_status" -ne 0 ]]; then
            if grep -Eq 'HTTP[^0-9]*404|404 Not Found' latest_error; then
              latest_tag=""
            else
              printf '%s\n' "$(<latest_error)" >&2
              echo "GitHub API failed while reading the latest release." >&2
              exit 1
            fi
          fi
          printf 'Latest published release: %s\n' "${latest_tag:-none}"
          printf 'latest_tag=%s\n' "$latest_tag" >> "$GITHUB_OUTPUT"

      - name: Select and synchronize version
        id: version
        if: steps.initial-freshness.outputs.stale != 'true' && steps.existing.outputs.skip != 'true' && steps.existing.outputs.reuse != 'true'
        env:
          LATEST_TAG: ${{ steps.latest.outputs.latest_tag }}
        shell: bash
        run: |
          set -euo pipefail
          if [[ -n "$LATEST_TAG" ]]; then
            version="$(python scripts/release.py --root . --latest "$LATEST_TAG")"
          else
            version="$(python scripts/release.py --root .)"
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "release_tag=v$version" >> "$GITHUB_OUTPUT"

      - name: Re-check main before writing
        id: final-freshness
        if: steps.initial-freshness.outputs.stale != 'true'
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin main --quiet
          current_sha="$(git rev-parse origin/main)"
          if [[ "$current_sha" != "$(git rev-parse HEAD)" ]]; then
            echo "main advanced while the version was being selected; skipping this push."
            echo "stale=true" >> "$GITHUB_OUTPUT"
          else
            echo "stale=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Commit version metadata
        if: steps.final-freshness.outputs.stale == 'false' && steps.existing.outputs.skip != 'true' && steps.existing.outputs.reuse != 'true'
        env:
          VERSION: ${{ steps.version.outputs.version }}
        shell: bash
        run: |
          set -euo pipefail
          if git diff --quiet -- Cargo.toml Cargo.lock uv.lock; then
            echo "Version metadata already records $VERSION."
            exit 0
          fi
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add Cargo.toml Cargo.lock uv.lock
          git commit -m "chore: bump version to $VERSION"
          git push origin HEAD:main

      - name: Emit eligible release source
        id: eligible
        if: steps.initial-freshness.outputs.stale == 'false' && steps.final-freshness.outputs.stale == 'false' && steps.existing.outputs.skip != 'true'
        env:
          EXISTING_TAG: ${{ steps.existing.outputs.release_tag }}
          SELECTED_TAG: ${{ steps.version.outputs.release_tag }}
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin main --quiet
          release_sha="$(git rev-parse HEAD)"
          if [[ "$(git rev-parse origin/main)" != "$release_sha" ]]; then
            echo "main advanced before release preparation completed; skipping this push."
            exit 0
          fi
          release_tag="${EXISTING_TAG:-$SELECTED_TAG}"
          if [[ -z "$release_tag" ]]; then
            echo "No release tag was selected; skipping."
            exit 0
          fi
          echo "release_sha=$release_sha" >> "$GITHUB_OUTPUT"
          echo "release_tag=$release_tag" >> "$GITHUB_OUTPUT"

  build-wheels:
    name: Build ${{ matrix.name }} wheel
    runs-on: ${{ matrix.runner }}
    needs: prepare-version
    if: ${{ needs.prepare-version.result == 'success' && needs.prepare-version.outputs.release_tag != '' }}
    strategy:
      fail-fast: true
      matrix:
        include:
          - name: linux-x86_64
            runner: ubuntu-latest
            target: x86_64
            manylinux: auto
          - name: windows-x64
            runner: windows-latest
            target: x64
            python_arch: x64
    steps:
      - name: Check out release source
        uses: actions/checkout@v7
        with:
          ref: ${{ needs.prepare-version.outputs.release_sha }}
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: '3.12'
          architecture: ${{ matrix.python_arch }}

      - name: Validate release tag
        shell: bash
        env:
          RELEASE_TAG: ${{ needs.prepare-version.outputs.release_tag }}
        run: |
          set -euo pipefail
          cargo_version="$(
            awk '
              /^\[package\]/ { in_package = 1; next }
              /^\[/ { in_package = 0 }
              in_package && $1 == "version" && $2 == "=" {
                gsub(/"/, "", $3)
                print $3
                exit
              }
            ' Cargo.toml
          )"
          if [[ -z "$cargo_version" ]]; then
            echo "Unable to read package version from Cargo.toml" >&2
            exit 1
          fi
          if [[ ! "$RELEASE_TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "Release tag '$RELEASE_TAG' is not a semantic version tag (vMAJOR.MINOR.PATCH)" >&2
            exit 1
          fi
          expected_tag="v${cargo_version}"
          if [[ "$RELEASE_TAG" != "$expected_tag" ]]; then
            echo "Release tag '$RELEASE_TAG' does not match Cargo.toml package version '$expected_tag'" >&2
            exit 1
          fi

      - name: Build wheel
        uses: PyO3/maturin-action@e83996d129638aa358a18fbd1dfb82f0b0fb5d3b # v1
        with:
          command: build
          target: ${{ matrix.target }}
          manylinux: ${{ matrix.manylinux }}
          maturin-version: '1.15.0'
          rust-toolchain: nightly
          args: --release --locked --out dist --compatibility pypi
          sccache: true

      - name: Upload wheel artifact
        uses: actions/upload-artifact@v7
        with:
          name: wheels-${{ matrix.name }}
          path: dist/*.whl
          if-no-files-found: error

  validate-wheels:
    name: Validate wheel set
    runs-on: ubuntu-latest
    needs: [build-wheels, prepare-version]
    if: ${{ needs.build-wheels.result == 'success' && needs.prepare-version.result == 'success' }}
    steps:
      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: '3.12'

      - name: Download wheel artifacts
        uses: actions/download-artifact@v8
        with:
          pattern: wheels-*
          path: dist
          merge-multiple: true

      - name: Set up uv
        uses: astral-sh/setup-uv@v10.0.1
        with:
          enable-cache: false

      - name: Check wheel metadata and contents
        shell: bash
        env:
          RELEASE_TAG: ${{ needs.prepare-version.outputs.release_tag }}
        run: |
          set -euo pipefail
          uvx twine check --strict dist/*.whl
          uv run --no-project --with packaging python - <<'PY'
          import os
          import re
          from email.parser import Parser
          from pathlib import Path
          from zipfile import ZipFile

          from packaging.tags import parse_tag
          from packaging.utils import canonicalize_name, parse_wheel_filename

          expected_name = "polars-mongo"
          release_tag = os.environ["RELEASE_TAG"]
          if not re.fullmatch(r"v[0-9]+\.[0-9]+\.[0-9]+", release_tag):
              raise SystemExit(f"invalid release tag: {release_tag!r}")
          expected_version = release_tag[1:]
          wheels = sorted(Path("dist").glob("*.whl"))
          if len(wheels) != 2:
              raise SystemExit(f"expected exactly two wheels, found {len(wheels)}")

          seen_platforms = set()
          for wheel in wheels:
              name, version, _, filename_tags = parse_wheel_filename(wheel.name)
              if name != expected_name or str(version) != expected_version:
                  raise SystemExit(f"wheel filename has unexpected package/version: {wheel.name}")
              platforms = {tag.platform for tag in filename_tags}
              if platforms == {"win_amd64"}:
                  platform_kind = "windows"
              elif all(re.fullmatch(r"manylinux(?:[0-9]+|_[0-9]+_[0-9]+)_x86_64", p) for p in platforms):
                  platform_kind = "linux"
              else:
                  raise SystemExit(f"unexpected wheel platform: {wheel.name}")
              if platform_kind in seen_platforms:
                  raise SystemExit(f"duplicate wheel platform: {wheel.name}")
              seen_platforms.add(platform_kind)

              with ZipFile(wheel) as archive:
                  if archive.testzip() is not None:
                      raise SystemExit(f"corrupt wheel archive: {wheel.name}")
                  names = archive.namelist()
                  metadata_names = [name for name in names if name.endswith(".dist-info/METADATA")]
                  wheel_names = [name for name in names if name.endswith(".dist-info/WHEEL")]
                  if len(metadata_names) != 1 or len(wheel_names) != 1:
                      raise SystemExit(f"wheel has invalid dist-info metadata: {wheel.name}")
                  expected_dist_info = f"{expected_name.replace('-', '_')}-{expected_version}.dist-info"
                  if metadata_names != [f"{expected_dist_info}/METADATA"] or wheel_names != [f"{expected_dist_info}/WHEEL"]:
                      raise SystemExit(f"unexpected dist-info directory in {wheel.name}")
                  metadata = Parser().parsestr(archive.read(metadata_names[0]).decode("utf-8"))
                  package_name = metadata.get("Name")
                  package_version = metadata.get("Version")
                  if canonicalize_name(package_name or "") != expected_name:
                      raise SystemExit(f"unexpected package name in {wheel.name}: {package_name!r}")
                  if package_version != expected_version:
                      raise SystemExit(f"unexpected package version in {wheel.name}: {package_version!r}")
                  wheel_metadata = Parser().parsestr(archive.read(wheel_names[0]).decode("utf-8"))
                  metadata_tags = set()
                  for tag in wheel_metadata.get_all("Tag", []):
                      metadata_tags.update(parse_tag(tag))
                  if metadata_tags != filename_tags:
                      raise SystemExit(f"wheel filename and WHEEL tags disagree: {wheel.name}")

          if seen_platforms != {"linux", "windows"}:
              raise SystemExit(f"unexpected wheel platform set: {sorted(seen_platforms)}")
          PY

      - name: Upload validated wheel set
        uses: actions/upload-artifact@v7
        with:
          name: validated-wheels
          path: dist/*.whl
          if-no-files-found: error

  release:
    name: Create GitHub release
    runs-on: ubuntu-latest
    needs: [prepare-version, validate-wheels]
    if: ${{ needs.prepare-version.result == 'success' && needs.validate-wheels.result == 'success' && needs.prepare-version.outputs.release_tag != '' }}
    permissions:
      contents: write
    outputs:
      release_tag: ${{ steps.create-release.outputs.release_tag }}
    steps:
      - name: Check out immutable release source
        uses: actions/checkout@v7
        with:
          ref: ${{ needs.prepare-version.outputs.release_sha }}
          fetch-depth: 0
          persist-credentials: true

      - name: Download validated wheel set
        uses: actions/download-artifact@v8
        with:
          name: validated-wheels
          path: dist

      - name: Re-check main before release creation
        env:
          RELEASE_SHA: ${{ needs.prepare-version.outputs.release_sha }}
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin main --quiet
          if [[ "$(git rev-parse HEAD)" != "$RELEASE_SHA" || "$(git rev-parse origin/main)" != "$RELEASE_SHA" ]]; then
            echo "main no longer points to the prepared release source; refusing to create a release." >&2
            exit 1
          fi

      - name: Create or retry release
        id: create-release
        env:
          GH_TOKEN: ${{ github.token }}
          REPOSITORY: ${{ github.repository }}
          RELEASE_TAG: ${{ needs.prepare-version.outputs.release_tag }}
          RELEASE_SHA: ${{ needs.prepare-version.outputs.release_sha }}
        shell: bash
        run: |
          set -euo pipefail
          commit_sha="$(git rev-parse HEAD)"
          if [[ "$commit_sha" != "$RELEASE_SHA" ]]; then
            echo "Checked out source does not match prepared release SHA; refusing to release." >&2
            exit 1
          fi
          git fetch origin main --quiet
          if [[ "$(git rev-parse origin/main)" != "$commit_sha" ]]; then
            echo "main advanced before release creation; refusing to release an old commit." >&2
            exit 1
          fi

          set +e
          tag_target="$(gh api "repos/$REPOSITORY/git/ref/tags/$RELEASE_TAG" --jq '.object.sha' 2>tag_error)"
          tag_status=$?
          set -e
          if [[ "$tag_status" -eq 0 ]]; then
            tag_type="$(gh api "repos/$REPOSITORY/git/ref/tags/$RELEASE_TAG" --jq '.object.type')"
            if [[ "$tag_type" == "tag" ]]; then
              tag_target="$(gh api "repos/$REPOSITORY/git/tags/$tag_target" --jq '.object.sha')"
            fi
            if [[ "$tag_target" != "$commit_sha" ]]; then
              echo "Tag $RELEASE_TAG already points to $tag_target, not $commit_sha; refusing to mutate it." >&2
              exit 1
            fi
            echo "Tag $RELEASE_TAG already points to this commit."
          elif grep -Eq 'HTTP[^0-9]*404|404 Not Found' tag_error; then
            echo "Tag $RELEASE_TAG does not exist yet."
          else
            printf '%s\n' "$(<tag_error)" >&2
            echo "GitHub API failed while checking tag $RELEASE_TAG." >&2
            exit 1
          fi

          set +e
          release_draft="$(gh api "repos/$REPOSITORY/releases/tags/$RELEASE_TAG" --jq '.draft' 2>release_error)"
          release_status=$?
          set -e
          if [[ "$release_status" -eq 0 ]]; then
            if [[ "$release_draft" == "true" ]]; then
              gh release edit "$RELEASE_TAG" --draft=false
            fi
            gh release upload "$RELEASE_TAG" dist/*.whl --clobber
            echo "Release $RELEASE_TAG already exists; safely retrying it."
          elif grep -Eq 'HTTP[^0-9]*404|404 Not Found' release_error; then
            gh release create "$RELEASE_TAG" --target "$commit_sha" --title "$RELEASE_TAG" --generate-notes dist/*.whl
          else
            printf '%s\n' "$(<release_error)" >&2
            echo "GitHub API failed while checking release $RELEASE_TAG." >&2
            exit 1
          fi
          echo "release_tag=$RELEASE_TAG" >> "$GITHUB_OUTPUT"

  # PyPI publication is disabled until Polars 2.0.0 final is on PyPI.
  #
  # This project's typed error transport (`tests/test_error_transport.py`) needs the
  # upstream fix in pola-rs/polars#29003, which removed the `ComputeError` stringify
  # of exceptions raised inside a `register_io_source` generator. That fix landed
  # after the `py-2.0.0-rc.1` tag, so `pyproject.toml` requires Polars at a git
  # revision - and PyPI rejects any distribution whose dependencies carry direct
  # URLs. Reverting to `polars==2.0.0rc1` to satisfy PyPI would fail 25 tests and
  # ship the exact silent degradation that test module exists to prevent.
  #
  # Until then the `release` job above publishes the same validated wheels as GitHub
  # release assets, which is the supported install channel (see README "Releases").
  #
  # TO REINTRODUCE once Polars 2.0.0 is released on PyPI: set the `polars` and
  # `polars-runtime-32` dependencies in `pyproject.toml` to `>=2.0.0`, re-run
  # `uv lock`, confirm `make test` is green against the released wheel, then
  # uncomment this job verbatim. It needs no other change: it consumes the
  # `validated-wheels` artifact the `validate-wheels` job already uploads, and the
  # `pypi` trusted-publishing environment is already configured.
  #
  # publish:
  #   name: Publish wheels to PyPI
  #   runs-on: ubuntu-latest
  #   needs: release
  #   if: ${{ needs.release.result == 'success' && needs.release.outputs.release_tag != '' }}
  #   environment:
  #     name: pypi
  #     url: https://pypi.org/p/polars-mongo
  #   permissions:
  #     id-token: write
  #   steps:
  #     - name: Download validated wheel set
  #       uses: actions/download-artifact@v8
  #       with:
  #         name: validated-wheels
  #         path: dist
  #
  #     - name: Publish package to PyPI
  #       uses: pypa/gh-action-pypi-publish@release/v1
  #       with:
  #         skip-existing: true
