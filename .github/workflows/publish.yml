name: Publish

on:
  release:
    types: [published]
  workflow_call:
    inputs:
      release_tag:
        description: Release tag to build and publish (vMAJOR.MINOR.PATCH)
        required: true
        type: string

concurrency:
  group: release-publish
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build-wheels:
    name: Build ${{ matrix.name }} wheel
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: true
      matrix:
        include:
          - name: linux-x86_64
            runner: ubuntu-latest
            target: x86_64
            manylinux: auto
          # - name: linux-aarch64
          #   runner: ubuntu-latest
          #   target: aarch64
          #   manylinux: auto
          - name: windows-x64
            runner: windows-latest
            target: x64
            python_arch: x64
    steps:
      - name: Install ARM dependencies
        if: matrix.target == 'aarch64'
        run: |
          sudo apt-get update
          sudo apt-get install -y gcc-aarch64-linux-gnu g++-aarch64-linux-gnu

      - name: Check out source
        uses: actions/checkout@v7
        with:
          ref: ${{ inputs.release_tag || github.ref_name }}
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: '3.12'
          architecture: ${{ matrix.python_arch }}

      - name: Validate release tag
        shell: bash
        env:
          RELEASE_TAG: ${{ inputs.release_tag || github.ref_name }}
        run: |
          set -euo pipefail
          cargo_version="$(
            awk '
              /^\[package\]/ { in_package = 1; next }
              /^\[/ { in_package = 0 }
              in_package && $1 == "version" && $2 == "=" {
                gsub(/"/, "", $3)
                print $3
                exit
              }
            ' Cargo.toml
          )"
          if [[ -z "$cargo_version" ]]; then
            echo "Unable to read package version from Cargo.toml" >&2
            exit 1
          fi
          if [[ ! "$RELEASE_TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "Release tag '$RELEASE_TAG' is not a semantic version tag (vMAJOR.MINOR.PATCH)" >&2
            exit 1
          fi
          expected_tag="v${cargo_version}"
          if [[ "$RELEASE_TAG" != "$expected_tag" ]]; then
            echo "Release tag '$RELEASE_TAG' does not match Cargo.toml package version '$expected_tag'" >&2
            exit 1
          fi

      - name: Build wheel
        uses: PyO3/maturin-action@e83996d129638aa358a18fbd1dfb82f0b0fb5d3b # v1
        env:
          CARGO_TARGET_AARCH64_UNKNOWN_LINUX_GNU_LINKER: aarch64-linux-gnu-gcc
          CC_aarch64_unknown_linux_gnu: aarch64-linux-gnu-gcc
        with:
          command: build
          target: ${{ matrix.target }}
          manylinux: ${{ matrix.manylinux }}
          maturin-version: '1.15.0'
          args: --release --locked --out dist --compatibility pypi
          sccache: ${{ !startsWith(github.ref, 'refs/tags/') }}

      - name: Upload wheel artifact
        uses: actions/upload-artifact@v4
        with:
          name: wheels-${{ matrix.name }}
          path: dist/*.whl
          if-no-files-found: error

  publish:
    name: Publish wheels to PyPI
    runs-on: ubuntu-latest
    needs: build-wheels
    if: ${{ needs.build-wheels.result == 'success' }}
    environment:
      name: pypi
      url: https://pypi.org/p/polars-mongo
    permissions:
      id-token: write
    steps:
      - name: Download wheel artifacts
        uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true

      - name: Verify wheel set
        shell: bash
        run: |
          set -euo pipefail
          shopt -s nullglob
          wheels=(dist/*.whl)
          test "${#wheels[@]}" -eq 3
          for pattern in \
            '*manylinux*_x86_64.whl' \
            '*manylinux*_aarch64.whl' \
            '*win_amd64.whl'
          do
            matches=(dist/$pattern)
            test "${#matches[@]}" -eq 1
          done

      - name: Publish package to PyPI
        uses: pypa/gh-action-pypi-publish@release/v1
