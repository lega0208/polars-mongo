name: CI

on:
  pull_request:
  workflow_call:
    inputs:
      ref:
        description: Source ref to validate
        required: false
        type: string
        default: ''

concurrency:
  group: ci-${{ inputs.ref || github.ref }}
  cancel-in-progress: true

env:
  # Pinned so an upstream server release cannot silently change the behaviour
  # the acceptance criteria are proven against.
  MONGODB_SERVER_VERSION: '8.0.4'

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ inputs.ref || github.sha }}

      - uses: dtolnay/rust-toolchain@nightly
        with:
          components: rustfmt, clippy

      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: ci-lint
          save-if: ${{ github.ref == 'refs/heads/main' }}

      - name: Lint Rust
        run: |
          cargo fmt --check
          cargo clippy --all-targets -- -D warnings

  rust:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ inputs.ref || github.sha }}

      - uses: dtolnay/rust-toolchain@nightly

      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: ci-rust
          save-if: ${{ github.ref == 'refs/heads/main' }}

      - name: Rust tests
        run: cargo test

  python:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ inputs.ref || github.sha }}

      - uses: dtolnay/rust-toolchain@nightly

      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: ci-python
          save-if: ${{ github.ref == 'refs/heads/main' }}

      - uses: astral-sh/setup-uv@v10.0.1
        with:
          enable-cache: true
          version-file: pyproject.toml
          save-cache: ${{ github.ref == 'refs/heads/main' }}
          cache-dependency-glob: |
            uv.lock
            pyproject.toml
            rust-toolchain.toml

      - name: Install the toolchain the pinned Polars runtime requires
        run: rustup toolchain install nightly-2026-09-01 --profile minimal

      # A service container is insufficient: the fixture spawns the binary
      # itself so it controls the port, dbpath, profiling flags and
      # `enableTestCommands`.
      - name: Install the MongoDB server binary
        run: |
          set -euo pipefail
          curl -fsSL https://www.mongodb.org/static/pgp/server-8.0.asc \
            | sudo gpg --dearmor -o /usr/share/keyrings/mongodb-server-8.0.gpg
          echo "deb [arch=amd64,arm64 signed-by=/usr/share/keyrings/mongodb-server-8.0.gpg] https://repo.mongodb.org/apt/ubuntu $(lsb_release -cs)/mongodb-org/8.0 multiverse" \
            | sudo tee /etc/apt/sources.list.d/mongodb-org-8.0.list
          sudo apt-get update
          sudo apt-get install -y "mongodb-org-server=${MONGODB_SERVER_VERSION}"

      # Explicit, so an install regression fails here rather than as a wall of
      # skips inside the test session.
      - name: Assert mongod is present
        run: mongod --version

      - name: Install dependencies and build extension
        run: uv sync --locked

      - name: Lint Python
        run: |
          uv run --no-sync ruff check .
          uv run --no-sync ruff format --check .
          uv run --no-sync ty check

      # `-W error` is scoped to the Polars unregistered-extension warning so an
      # AC-21 regression is a red build rather than a quiet warning.
      - name: Python tests
        run: >-
          uv run --no-sync pytest --require-mongo
          -W "error:Extension type .* is not registered"
