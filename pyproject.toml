[build-system]
requires = ["maturin>=1.9,<2.0"]
build-backend = "maturin"

[project]
name = "polars-mongo"
description = "Polars expression plugin for MongoDB-flavoured data"
readme = "README.md"
requires-python = ">=3.12"
license = { text = "MIT" }
dependencies = ["polars>=1.44"]
dynamic = ["version"]
classifiers = [
    "Programming Language :: Python :: 3",
    "Programming Language :: Rust",
    "Typing :: Typed",
]

[tool.maturin]
module-name = "polars_mongo._internal"
python-source = "python"
features = ["pyo3/extension-module"]

[dependency-groups]
dev = [
    "maturin>=1.15",
    "pytest>=8.3",
    "ruff>=0.14",
    "mypy>=1.14",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
line-length = 100
src = ["python", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "TC"]

[tool.mypy]
files = ["python", "tests"]
strict = true
