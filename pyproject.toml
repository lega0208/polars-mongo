[build-system]
requires = ["maturin>=1.9,<2.0"]
build-backend = "maturin"

[project]
name = "polars-mongo"
description = "Polars expression plugin for MongoDB-flavoured data"
readme = "README.md"
requires-python = ">=3.12"
license = { text = "MIT" }
dependencies = [
    "polars==2.0.0rc1",
    "polars-runtime-32==2.0.0rc1",
    "pyarrow>=17",
]
dynamic = ["version"]
classifiers = [
    "Programming Language :: Python :: 3",
    "Programming Language :: Rust",
    "Typing :: Typed",
]

[tool.maturin]
module-name = "polars_mongo._internal"
python-source = "python"
features = ["pyo3/extension-module"]

[dependency-groups]
dev = [
    "maturin>=1.15",
    "pytest>=8.3",
    "ruff>=0.14",
    "ty>=0.0.80",
    # Independent BSON oracle for the test harness. Never a runtime dependency.
    "pymongo>=4.10",
    "pyarrow-stubs>=20.0.0.20260819",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q --strict-markers"
markers = [
    "mongo: requires the ephemeral mongod fixture (a live server)",
]

[tool.ruff]
line-length = 100
src = ["python", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "TC"]

[tool.ty.src]
include = ["python", "tests"]

[tool.ty.rules]
all = "error"

[tool.uv]
required-version = ">=0.11.11"